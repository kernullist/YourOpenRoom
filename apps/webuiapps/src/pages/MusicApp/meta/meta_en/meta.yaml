app_id: 3
app_name: youtube
app_display_name: YouTube
version: "1.0.0"
description: >
  YouTube launcher app. It stores recent searches and saved topics in state.json, and can open
  YouTube searches directly inside the app workflow. This metadata defines Agent → Frontend actions.
displayDesc: >
  A fast YouTube search launcher for opening artist, song, and topic searches with one action.

actions:
  - type: OPEN_SEARCH
    name: Open Search
    description: >
      Search YouTube for a keyword, artist, song, or topic. The app updates the search state and opens the result view.
    params:
      - name: query
        type: string
        description: Search query, for example "IVE I AM"
        required: true
      - name: autoplay
        type: string
        description: >
          Optional. Set to "1" to auto-start the top result instead of only
          cueing it in the player.
        required: false

  - type: OPEN_HOME
    name: Open Home
    description: >
      Open the YouTube home page from inside the app.
    params: []

  - type: OPEN_VIDEO
    name: Open Video
    description: >
      Open a specific YouTube watch URL or video directly inside the app player popup.
      The video starts playing automatically unless autoplay is set to "0".
    params:
      - name: url
        type: string
        description: Full YouTube video URL, for example "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        required: true
      - name: autoplay
        type: string
        description: >
          Optional. Playback starts automatically by default; set to "0" to only
          cue the video in the player without starting it.
        required: false

  - type: PLAY_LAST_PLAYLIST
    name: Play Last Playlist
    description: >
      Resume in-app queue playback of the most recently played playlist (falling back to the
      active playlist) using the last used playback mode (sequential or shuffle).
    params: []

  - type: SYNC_STATE
    name: Sync State
    description: >
      After the Agent has written state.json to NAS, notify the app to re-read the state file
      and apply every field (searches, topics, playlists, player preferences) to the UI.
    params: []
