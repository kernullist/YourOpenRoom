app_id: 3
app_name: youtube
app_display_name: YouTube
version: "1.0.0"
description: >
  YouTube 启动器应用。最近搜索、收藏主题、应用内播放列表与播放器偏好保存在 state.json 中，
  可以在应用内直接打开 YouTube 搜索、指定视频与播放列表队列。本文件仅定义 Agent → 前端 的操作指令。
displayDesc: >
  快速的 YouTube 搜索启动器，一条指令即可打开歌手、歌曲或主题搜索。

actions:
  - type: OPEN_SEARCH
    name: 打开搜索
    description: >
      按关键词、歌手、歌曲或主题搜索 YouTube。应用会更新搜索状态并打开结果视图。
    params:
      - name: query
        type: string
        description: 搜索关键词，例如 "IVE I AM"
        required: true
      - name: autoplay
        type: string
        description: >
          可选。设为 "1" 时自动播放第一条结果，而不是仅在播放器中加载待播。
        required: false
      - name: exclude
        type: string
        description: >
          可选。用户明确拒绝的关键词（换行分隔，例如"달플리 말고 ..."中的
          "달플리"）。这些词会作为减号运算符附加到搜索中，且标题或频道包含
          任一关键词的结果会被过滤，确保被拒绝的内容不会再次播放。
        required: false

  - type: OPEN_HOME
    name: 打开首页
    description: >
      从应用内打开 YouTube 首页。
    params: []

  - type: OPEN_VIDEO
    name: 打开视频
    description: >
      在应用内播放器弹窗中直接打开指定的 YouTube 视频链接。
      默认自动开始播放，除非 autoplay 设为 "0"。
    params:
      - name: url
        type: string
        description: 完整的 YouTube 视频链接，例如 "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        required: true
      - name: autoplay
        type: string
        description: >
          可选。默认自动播放；设为 "0" 时仅在播放器中加载视频而不开始播放。
        required: false

  - type: PLAY_LAST_PLAYLIST
    name: 播放最近播放列表
    description: >
      以应用内队列方式恢复最近播放过的播放列表（找不到时回退到当前选中的播放列表），
      并沿用上次的播放模式（顺序或随机）。
    params: []

  - type: SYNC_STATE
    name: 同步状态
    description: >
      Agent 将 state.json 写入 NAS 后，通知应用重新读取状态文件，
      并把每个字段（搜索、主题、播放列表、播放器偏好）应用到界面。
    params: []

# App → Agent 通知事件。由用户操作触发、应用上报；不是可调用指令，Agent 不得主动派发。
reported_events:
  - type: PLAY_VIDEO
    name: 播放视频
    description: >
      用户开始播放某个具体视频时上报（点击搜索结果、启动队列播放或预览播放列表条目）。
      队列自动切歌不会上报；实时"当前在放什么"请读取 state.json 的 nowPlaying 字段。
    params:
      - name: video_id
        type: string
        description: 开始播放的 YouTube 视频 id
      - name: title
        type: string
        description: 视频标题
      - name: channel
        type: string
        description: 视频频道名
      - name: queue
        type: string
        description: 队列播放时的播放列表名称；单曲播放为空字符串
