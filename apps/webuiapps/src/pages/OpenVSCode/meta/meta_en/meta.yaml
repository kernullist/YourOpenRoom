app_display_name: Aoi's IDE
description: >
  VSCode-style built-in workspace editor for OpenRoom. Browse files, open multiple text files, edit
  with Monaco, search the workspace, run safe verification commands, and save changes directly from
  the in-app IDE.
actions:
  - type: OPEN_FILE
    name: Open File
    description: Open a specific file in the IDE editor.
    params:
      - name: path
        type: string
        required: true
        description: File path relative to the configured workspace root.
  - type: CREATE_FILE
    name: Create File
    description: Create an empty file in the IDE workspace and open it in the editor.
    params:
      - name: path
        type: string
        required: true
        description: File path relative to the configured workspace root.
  - type: REFRESH_WORKSPACE
    name: Refresh Workspace
    description: Reload the workspace tree from disk.
  - type: SAVE_FILE
    name: Save File
    description: Save the currently active editor tab to disk.
  - type: PREVIEW_APPEND_ACTIVE_FILE
    name: Preview Append To Active File
    description:
      Build a patch preview for appending or prepending text to the active editor tab. Does not
      modify the file until APPLY_ACTIVE_FILE_PREVIEW is called.
    params:
      - name: content
        type: string
        required: true
        description: Text to add to the active file.
      - name: position
        type: string
        required: false
        description: Use "end" to append or "start" to prepend. Defaults to "end".
      - name: separator
        type: string
        required: false
        description: Text inserted between existing content and new content. Defaults to a newline.
      - name: save
        type: string
        required: false
        description:
          Set to "false" if applying the preview should keep the edit in the editor buffer without
          saving. Defaults to true.
  - type: PREVIEW_PATCH_ACTIVE_FILE
    name: Preview Patch Active File
    description:
      Build a patch preview for exact text replacement in the active editor tab. Does not modify the
      file until APPLY_ACTIVE_FILE_PREVIEW is called.
    params:
      - name: old_text
        type: string
        required: true
        description: Exact text to replace in the active editor buffer.
      - name: new_text
        type: string
        required: true
        description: Replacement text.
      - name: expected_occurrences
        type: string
        required: false
        description: Optional exact expected number of old_text occurrences.
      - name: replace_all
        type: string
        required: false
        description: Set to "true" to replace all occurrences. Defaults to false.
      - name: save
        type: string
        required: false
        description:
          Set to "false" if applying the preview should keep the edit in the editor buffer without
          saving. Defaults to true.
  - type: PREVIEW_REPLACE_ACTIVE_FILE
    name: Preview Replace Active File
    description:
      Build a full-file replacement preview for the active editor tab. Does not modify the file
      until APPLY_ACTIVE_FILE_PREVIEW is called.
    params:
      - name: content
        type: string
        required: true
        description: Full file content to preview in the active editor buffer.
      - name: save
        type: string
        required: false
        description:
          Set to "false" if applying the preview should keep the edit in the editor buffer without
          saving. Defaults to true.
  - type: PREVIEW_REPLACE_ACTIVE_SELECTION
    name: Preview Replace Active Selection
    description:
      Build a patch preview that replaces only the currently selected editor text. Does not modify
      the file until APPLY_ACTIVE_FILE_PREVIEW is called.
    params:
      - name: content
        type: string
        required: true
        description: Replacement text for the selected range.
      - name: save
        type: string
        required: false
        description:
          Set to "false" if applying the preview should keep the edit in the editor buffer without
          saving. Defaults to true.
  - type: APPLY_ACTIVE_FILE_PREVIEW
    name: Apply Active File Preview
    description:
      Apply the pending active-file patch preview and save it when the preview was created with save
      enabled.
  - type: DISCARD_ACTIVE_FILE_PREVIEW
    name: Discard Active File Preview
    description: Discard the pending active-file patch preview without changing the editor buffer.
  - type: UNDO_MODEL_ACTION
    name: Undo Model Action
    description:
      Restore the previous editor content for the most recent reversible model action, or a specific
      action id if one is provided.
    params:
      - name: id
        type: string
        required: false
        description: Optional model action id from the Actions panel or state summary.
  - type: APPEND_ACTIVE_FILE
    name: Append To Active File
    description:
      Append or prepend text to the currently active editor tab. Saves to disk by default.
    params:
      - name: content
        type: string
        required: true
        description: Text to add to the active file.
      - name: position
        type: string
        required: false
        description: Use "end" to append or "start" to prepend. Defaults to "end".
      - name: separator
        type: string
        required: false
        description: Text inserted between existing content and new content. Defaults to a newline.
      - name: save
        type: string
        required: false
        description:
          Set to "false" to keep the edit in the editor buffer without saving. Defaults to true.
  - type: PATCH_ACTIVE_FILE
    name: Patch Active File
    description:
      Replace exact text in the currently active editor tab. Saves to disk by default and preserves
      unsaved editor content.
    params:
      - name: old_text
        type: string
        required: true
        description: Exact text to replace in the active editor buffer.
      - name: new_text
        type: string
        required: true
        description: Replacement text.
      - name: expected_occurrences
        type: string
        required: false
        description: Optional exact expected number of old_text occurrences.
      - name: replace_all
        type: string
        required: false
        description: Set to "true" to replace all occurrences. Defaults to false.
      - name: save
        type: string
        required: false
        description:
          Set to "false" to keep the edit in the editor buffer without saving. Defaults to true.
  - type: REPLACE_ACTIVE_FILE
    name: Replace Active File
    description:
      Replace the full content of the currently active editor tab. Saves to disk by default.
    params:
      - name: content
        type: string
        required: true
        description: Full file content to place in the active editor buffer.
      - name: save
        type: string
        required: false
        description:
          Set to "false" to keep the edit in the editor buffer without saving. Defaults to true.
  - type: REPLACE_ACTIVE_SELECTION
    name: Replace Active Selection
    description:
      Replace only the currently selected text in the active editor tab. Saves to disk by default.
    params:
      - name: content
        type: string
        required: true
        description: Replacement text for the selected range.
      - name: save
        type: string
        required: false
        description:
          Set to "false" to keep the edit in the editor buffer without saving. Defaults to true.
  - type: SEARCH_WORKSPACE
    name: Search Workspace
    description: Search the IDE workspace by file path and file content.
    params:
      - name: query
        type: string
        required: true
        description: Search query to match against workspace file paths or content.
  - type: RUN_COMMAND
    name: Run Safe Command
    description:
      Run a safe read-only command in the IDE workspace, such as git status or pnpm build.
    params:
      - name: command
        type: string
        required: true
        description: Safe command accepted by the workspace command policy.
  - type: RUN_DIAGNOSTICS
    name: Run Diagnostics
    description:
      Run a safe verification command, parse diagnostics, and populate the IDE Problems panel.
    params:
      - name: command
        type: string
        required: false
        description:
          Safe command accepted by the workspace command policy. Defaults to the current Problems
          panel command.
  - type: REFRESH_GIT_STATUS
    name: Refresh Git Status
    description:
      Refresh the Source Control panel with safe read-only git status and diff information.
